version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: silverbridge-ai-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6019}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-silverbridge_ai}
      POSTGRES_USER: ${POSTGRES_USER:-silverbridge_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silverbridge_ai_pw}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  ai-server:
    build: .
    container_name: silverbridge-ai-server
    restart: unless-stopped
    # 호스트 메모리가 바닥나면 커널이 이 서버보다 다른 프로세스를 먼저 정리하게 한다 (2026-11-10: 옆 일회용 컨테이너가
    # 메모리를 다 써서 커널이 이 서버를 죽였다). -1000(절대 안 죽임)은 이 서버가 새는 경우 호스트 전체가 위험해 쓰지 않는다
    oom_score_adj: -500
    gpus: all
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface/hub
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
      - ./data/huggingface:/root/.cache/huggingface
    shm_size: "2gb"
